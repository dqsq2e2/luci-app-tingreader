name: Build ting-reader Backend

on:
  repository_dispatch:
    types: [upstream-released]
  schedule:
    - cron: '0 * * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      ting_reader_tag:
        description: 'Upstream tag, e.g. v2.0.0. Blank detects the latest release.'
        required: false
        default: ''
      force:
        description: 'Rebuild an already published version'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-backend
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  TING_READER_REPO: dqsq2e2/ting-reader

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      need_build: ${{ steps.detect.outputs.need_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect upstream version
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.ting_reader_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG="${REQUESTED_TAG:-$(gh release view --repo "$TING_READER_REPO" --json tagName --jq .tagName)}"
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
          CURRENT="$(awk -F':=' '/^TINGREADER_VERSION:=/{print $2}' version.mk)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == true || "$VERSION" != "$CURRENT" ]]; then
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.need_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APP_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TING_READER_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          path: upstream
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/backend/target
          key: openwrt-backend-${{ matrix.arch }}-${{ hashFiles('upstream/backend/Cargo.lock') }}
          restore-keys: openwrt-backend-${{ matrix.arch }}-
      - name: Enable vendored OpenSSL
        working-directory: upstream/backend
        run: |
          if ! grep -q '^openssl[[:space:]]*=' Cargo.toml; then
            sed -i '/^\[dependencies\]/a openssl = { version = "0.10", features = ["vendored"] }\nopenssl-sys = { version = "0.9", features = ["vendored"] }' Cargo.toml
          fi
      - name: Build backend natively
        working-directory: upstream/backend
        env:
          OPENSSL_STATIC: '1'
        run: cargo build --release
      - name: Package backend, FFmpeg and runtime
        working-directory: upstream/backend
        run: bash "$GITHUB_WORKSPACE/packaging/.github/scripts/package-backend.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: ting-reader-backend-linux-${{ matrix.arch }}-${{ env.VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: dist
          merge-multiple: true
      - name: Fetch matching Web frontend and generate manifest
        run: |
          curl -fL --retry 5 --retry-delay 15 \
            "https://github.com/$TING_READER_REPO/releases/download/$TAG/ting-reader-frontend-$VERSION.tar.gz" \
            -o "dist/ting-reader-frontend-$VERSION.tar.gz"
          python3 .github/scripts/release-manifest.py
      - name: Publish backend Release and latest download index
        run: |
          release_tag="backend-v$VERSION"
          notes_file="$RUNNER_TEMP/backend-notes.md"
          cat > "$notes_file" <<EOF
          Ting Reader ${VERSION}，供 LuCI 程序管理页面下载。

          提供 x86_64 和 ARM64 后端，包含匹配的运行库、FFmpeg、FFprobe 和预装商店。
          Web 前端从主项目同版本 Release 下载；安装器使用 manifest.json 校验文件。
          EOF
          assets=(dist/ting-reader-backend-linux-*.tar.gz dist/manifest.json dist/SHA256SUMS)
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
            gh release edit "$release_tag" --title "Backend v$VERSION" --notes-file "$notes_file" --latest=false
          else
            gh release create "$release_tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "Backend v$VERSION" --notes-file "$notes_file" --latest=false
          fi
          if gh release view backend-latest >/dev/null 2>&1; then
            gh release upload backend-latest dist/latest.json --clobber
          else
            gh release create backend-latest dist/latest.json --target "$GITHUB_SHA" \
              --title "Backend download index" --notes "LuCI 自动下载使用的版本索引。" \
              --prerelease --latest=false
          fi
      - name: Record successfully published version
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("dist/manifest.json").read_text())
          pathlib.Path("version.mk").write_text(
              "# Last successfully published backend Release.\n"
              f"TINGREADER_VERSION:={m['version']}\n"
              f"TINGREADER_BACKEND_AMD64_HASH:={m['backend']['amd64']['sha256']}\n"
              f"TINGREADER_BACKEND_ARM64_HASH:={m['backend']['arm64']['sha256']}\n"
              f"TINGREADER_FRONTEND_HASH:={m['frontend']['sha256']}\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.mk
          if ! git diff --cached --quiet; then
            git commit -m "chore: record backend v$VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
