name: Build OpenWrt Ting Reader

on:
  push:
    branches: [main]
    paths:
      - 'luci-app-tingreader/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. luci-v2.0.0-r1. Blank builds artifacts only.'
        required: false
        default: ''
      release_notes:
        description: 'Additional Release notes'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: luci-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: LuCI all (${{ matrix.format }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: 24.10.8, format: ipk }
          - { sdk: 25.12.5, format: apk }
    steps:
      - uses: actions/checkout@v4
      - name: Build architecture-independent LuCI and translations
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: tingreader_ci
          PACKAGES: luci-app-tingreader
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s
      - name: Collect packages
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p artifacts
          find bin/ -type f -name "luci-*tingreader*.$FORMAT" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -name "luci-app-tingreader*.$FORMAT" -print -quit)"
          test -n "$(find artifacts -name "luci-i18n-tingreader-zh-cn*.$FORMAT" -print -quit)"
          for package in artifacts/*; do
            case "$package" in *_all.ipk|*.apk) ;; *) echo "Unexpected package: $package"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: LuCI-all-${{ matrix.format }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LuCI-all-*
          path: release
          merge-multiple: true
      - name: Publish LuCI packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          [[ "$RELEASE_TAG" =~ ^luci-v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]
          notes_file="$RUNNER_TEMP/luci-notes.md"
          cat > "$notes_file" <<'EOF'
          只需安装 luci-app-tingreader 和可选中文语言包。
          IPK/APK 均为架构无关包；根据系统包管理器选择格式。
          安装后进入「服务 → Ting Reader → 程序管理」，下载前后端，再启用服务。
          下载支持 GitHub 直连、自动加速和自定义 HTTPS 加速地址。
          后端支持 x86_64 与 ARM64，程序可安装到外置磁盘。
          EOF
          printf '\n%s\n' "$EXTRA_NOTES" >> "$notes_file"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --title "LuCI $RELEASE_TAG" --notes-file "$notes_file" --latest
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" \
              --title "LuCI $RELEASE_TAG" --notes-file "$notes_file" --latest
          fi
