name: Cleanup CI History

# Cleans up stale GitHub Actions caches and old workflow runs.
# Called by Daily-Maintenance.yml and can also be run manually.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-ci-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean caches & old runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_RETENTION_DAYS: '3'
      CACHE_KEEP_PER_GROUP: '2'
      RUN_RETENTION_DAYS: '7'
      RUN_KEEP_PER_WORKFLOW: '3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete stale caches & old workflow runs
        run: bash .github/scripts/cleanup-actions-storage.sh
